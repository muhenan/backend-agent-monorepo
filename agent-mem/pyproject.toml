[project]
name = "agent-mem"
version = "0.1.0"
description = "A small chatbot for learning Mem0 long-term memory with OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "mem0ai>=0.1.118",
    "openai-agents>=0.2.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[project.scripts]
agent-mem = "agent_mem.app:run"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mem"]
only-include = ["src/agent_mem"]

[tool.ruff]
line-length = 100
target-version = "py312"
