services:
  minio:
    image: django-agent-minio:RELEASE.2025-09-07T16-13-09Z
    build:
      context: ./minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-django-agent}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-django-agent-local-password}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-django_agent}
      POSTGRES_USER: ${POSTGRES_USER:-django_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-django_agent} -d ${POSTGRES_DB:-django_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "uv run --no-sync python manage.py migrate &&
      uv run --no-sync python manage.py init_object_storage &&
      uv run --no-sync uvicorn config.asgi:application --host 0.0.0.0 --port 8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:?Please set OPENAI_MODEL in .env}
      OPENAI_AGENTS_DISABLE_TRACING: ${OPENAI_AGENTS_DISABLE_TRACING:-}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_ENGINE: postgres
      DB_NAME: ${POSTGRES_DB:-django_agent}
      DB_USER: ${POSTGRES_USER:-django_agent}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-django_agent}
      DB_HOST: db
      DB_PORT: 5432
      S3_ENDPOINT_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-django-agent}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-django-agent-local-password}
      S3_BUCKET: ${S3_BUCKET:-chat-attachments}
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      minio:
        condition: service_started
      db:
        condition: service_healthy

volumes:
  minio_data:
  postgres_data:
